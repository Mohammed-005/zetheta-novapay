apiVersion: apps/v1
kind: Deployment
metadata:
  name: novapay-blue
  namespace: novapay
  labels:
    app: novapay
    version: blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: novapay
      version: blue
  template:
    metadata:
      labels:
        app: novapay
        version: blue
    spec:
      containers:
        - name: novapay
          image: novapay:1.0.0
          ports:
            - containerPort: 8080
          env:
            - name: APP_VERSION
              value: "blue"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: novapay-green
  namespace: novapay
  labels:
    app: novapay
    version: green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: novapay
      version: green
  template:
    metadata:
      labels:
        app: novapay
        version: green
    spec:
      containers:
        - name: novapay
          image: novapay:1.0.0
          ports:
            - containerPort: 8080
          env:
            - name: APP_VERSION
              value: "green"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: novapay
  namespace: novapay
spec:
  selector:
    app: novapay
    version: blue
  ports:
    - port: 80
      targetPort: 8080
