apiVersion: apps/v1
kind: Deployment
metadata:
  name: novapay-canary
  namespace: novapay
  labels:
    app: novapay
    version: canary
spec:
  replicas: 1
  selector:
    matchLabels:
      app: novapay
      version: canary
  template:
    metadata:
      labels:
        app: novapay
        version: canary
    spec:
      containers:
        - name: novapay
          image: novapay:1.0.0
          ports:
            - containerPort: 8080
          env:
            - name: APP_VERSION
              value: "canary"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
