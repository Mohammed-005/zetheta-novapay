<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<rect width="1600" height="900" fill="white"/>

<text x="800" y="55" text-anchor="middle"
      font-family="Arial" font-size="34" font-weight="bold">
  NovaPay Zero-Downtime CI/CD Architecture
</text>

<g font-family="Arial" font-size="20" text-anchor="middle">
  <rect x="70" y="130" width="220" height="90" rx="12" fill="#e8f0fe" stroke="#333" stroke-width="2"/>
  <text x="180" y="170">Developer</text>
  <text x="180" y="200">Signed Commit / PR</text>

  <rect x="360" y="130" width="250" height="90" rx="12" fill="#e8f0fe" stroke="#333" stroke-width="2"/>
  <text x="485" y="170">GitHub</text>
  <text x="485" y="200">Protected main</text>

  <rect x="680" y="100" width="300" height="150" rx="12" fill="#eef7e8" stroke="#333" stroke-width="2"/>
  <text x="830" y="135" font-weight="bold">CI/CD Pipeline</text>
  <text x="830" y="170">Build + Tests</text>
  <text x="830" y="198">SAST + Dependency</text>
  <text x="830" y="226">DAST + Compliance</text>

  <rect x="1050" y="130" width="220" height="90" rx="12" fill="#fff3cd" stroke="#333" stroke-width="2"/>
  <text x="1160" y="170">Container Registry</text>
  <text x="1160" y="200">Immutable Image</text>

  <rect x="1340" y="130" width="190" height="90" rx="12" fill="#fce8e6" stroke="#333" stroke-width="2"/>
  <text x="1435" y="170">Approval</text>
  <text x="1435" y="200">Policy Gates</text>

  <rect x="500" y="380" width="260" height="110" rx="12" fill="#e8f0fe" stroke="#333" stroke-width="2"/>
  <text x="630" y="420" font-weight="bold">Kubernetes</text>
  <text x="630" y="450">Blue / Green</text>
  <text x="630" y="478">Canary</text>

  <rect x="850" y="380" width="260" height="110" rx="12" fill="#eef7e8" stroke="#333" stroke-width="2"/>
  <text x="980" y="420" font-weight="bold">Traffic Gateway</text>
  <text x="980" y="450">Stable / Canary</text>
  <text x="980" y="478">Routing + Health</text>

  <rect x="1200" y="380" width="260" height="110" rx="12" fill="#fff3cd" stroke="#333" stroke-width="2"/>
  <text x="1330" y="420" font-weight="bold">Application</text>
  <text x="1330" y="450">NovaPay API</text>
  <text x="1330" y="478">Health / Metrics</text>

  <rect x="570" y="620" width="300" height="110" rx="12" fill="#f3e8ff" stroke="#333" stroke-width="2"/>
  <text x="720" y="660" font-weight="bold">Database</text>
  <text x="720" y="690">Expand → Migrate</text>
  <text x="720" y="718">→ Contract</text>

  <rect x="980" y="620" width="300" height="110" rx="12" fill="#fce8e6" stroke="#333" stroke-width="2"/>
  <text x="1130" y="660" font-weight="bold">Observability</text>
  <text x="1130" y="690">Metrics + Logs</text>
  <text x="1130" y="718">Alerts + Rollback</text>

  <rect x="650" y="790" width="300" height="60" rx="12" fill="#e8f0fe" stroke="#333" stroke-width="2"/>
  <text x="800" y="828">Automated Rollback</text>
</g>

<g stroke="#333" stroke-width="3" fill="none" marker-end="url(#arrow)">
  <line x1="290" y1="175" x2="360" y2="175"/>
  <line x1="610" y1="175" x2="680" y2="175"/>
  <line x1="980" y1="175" x2="1050" y2="175"/>
  <line x1="1270" y1="175" x2="1340" y2="175"/>
  <line x1="1435" y1="220" x2="630" y2="380"/>
  <line x1="760" y1="435" x2="850" y2="435"/>
  <line x1="1110" y1="435" x2="1200" y2="435"/>
  <line x1="1330" y1="490" x2="720" y2="620"/>
  <line x1="1330" y1="490" x2="1130" y2="620"/>
  <line x1="1130" y1="730" x2="950" y2="820"/>
</g>

<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10"
          refX="9" refY="3" orient="auto">
    <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
  </marker>
</defs>
</svg>
